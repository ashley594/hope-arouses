<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hope Arouses — Tangerine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #050505; color: #f3ede4; font-family: 'Jost', sans-serif; -webkit-font-smoothing: antialiased; }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; padding: 32px 5vw; }
  .mark { font-size: 11px; letter-spacing: 0.3em; opacity: 0.6; }
  a.contact { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #f3ede4; text-decoration: none; border-bottom: 1px solid transparent; }
  .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px; }
  h1 { font-family: 'Tangerine', cursive; font-weight: 700; font-size: clamp(7rem, 26vw, 17rem); line-height: 0.85; margin: 0; color: #f3ede4; }
  .eyebrow { margin-top: 8px; font-size: 12px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(243,237,228,0.55); }
  .signup { margin-top: 60px; display: flex; gap: 20px; border-bottom: 1px solid rgba(243,237,228,0.22); padding-bottom: 10px; }
  .signup input { background: none; border: none; outline: none; color: #f3ede4; font-family: 'Jost'; font-size: 14px; width: 240px; }
  .signup input::placeholder { color: rgba(243,237,228,0.4); }
  .signup button { background: none; border: none; color: #f3ede4; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; }
  .label { position: fixed; bottom: 24px; left: 24px; font-size: 10px; letter-spacing: 0.15em; color: rgba(243,237,228,0.35); text-transform: uppercase; }
</style>
</head>
<body>
<div class="label">Font: Tangerine</div>
<header><div class="mark">HOPE&nbsp;AROUSES</div><a class="contact" href="#contact">Contact</a></header>
<section class="hero">
  <h1>Hope Arouses</h1>
  <div class="eyebrow">Coming 2027</div>
  <div class="signup"><input type="email" placeholder="Your email address"><button>Notify Me</button></div>
</section>
</body>
</html>
