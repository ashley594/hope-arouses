<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hope Arouses — Option C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: #050505;
    color: #f3ede4;
    font-family: 'Jost', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    padding: 32px 5vw;
  }
  .mark { font-size: 11px; letter-spacing: 0.3em; opacity: 0.6; }
  a.contact {
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: #f3ede4; text-decoration: none; border-bottom: 1px solid transparent;
  }
  a.contact:hover { border-color: #f3ede4; }

  .hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .layer-wrap {
    position: relative;
    text-align: center;
  }
  .ghost {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: clamp(3.5rem, 12vw, 9rem);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: transparent;
    -webkit-text-stroke: 1px rgba(243,237,228,0.28);
    line-height: 0.95;
    margin: 0;
    white-space: nowrap;
  }
  .script {
    font-family: 'Allura', cursive;
    font-size: clamp(4rem, 13vw, 9.5rem);
    color: #f3ede4;
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-4deg);
    white-space: nowrap;
  }
  .eyebrow {
    margin-top: 40px;
    font-size: 12px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(243,237,228,0.55);
    text-align: center;
  }
  .signup {
    margin: 50px auto 0;
    width: fit-content;
    display: flex;
    gap: 20px;
    border-bottom: 1px solid rgba(243,237,228,0.22);
    padding-bottom: 10px;
  }
  .signup input {
    background: none; border: none; outline: none;
    color: #f3ede4; font-family: 'Jost'; font-size: 14px; width: 240px;
  }
  .signup input::placeholder { color: rgba(243,237,228,0.4); }
  .signup button {
    background: none; border: none; color: #f3ede4;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
  }
  .hero-content { text-align: center; }
  .contact-section {
    height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(243,237,228,0.4);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .label {
    position: fixed; bottom: 24px; left: 24px;
    font-size: 10px; letter-spacing: 0.15em; color: rgba(243,237,228,0.35);
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="label">Option C — Layered / Kinetic Type</div>
<header>
  <div class="mark">HOPE&nbsp;AROUSES</div>
  <a class="contact" href="#contact">Contact</a>
</header>
<section class="hero">
  <div class="hero-content">
    <div class="layer-wrap">
      <p class="ghost">Coming 2027</p>
      <p class="script">Hope Arouses</p>
    </div>
    <div class="eyebrow">A new house of intimates</div>
    <div class="signup">
      <input type="email" placeholder="Your email address">
      <button>Notify Me</button>
    </div>
  </div>
</section>
<section class="contact-section" id="contact">— contact block placeholder —</section>
</body>
</html>
