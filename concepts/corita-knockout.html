<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hope Arouses — Corita: Knockout Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;900&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: #f4f1e8;
    color: #1a1a1a;
    font-family: 'Archivo', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; justify-content: space-between;
    padding: 28px 5vw;
  }
  .mark { font-size: 12px; letter-spacing: 0.25em; font-weight: 700; }
  a.contact {
    font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase;
    color: #1a1a1a; text-decoration: none; font-weight: 700;
    border-bottom: 2px solid transparent;
  }
  a.contact:hover { border-color: #1a1a1a; }

  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 140px 5vw 60px;
    gap: 44px;
  }

  .block {
    position: relative;
    width: min(920px, 92vw);
    height: min(56vw, 62vh);
    min-height: 320px;
    background: #d4291b;
    overflow: hidden;
    transform: rotate(-1.1deg);
    box-shadow: 10px 10px 0 rgba(26,26,26,0.08);
  }
  .block .dot {
    position: absolute;
    top: -6%; right: 6%;
    width: 90px; height: 90px;
    background: #f4f1e8;
    border-radius: 50%;
    z-index: 2;
  }
  .knockout {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -52%) rotate(1.1deg);
    width: 112%;
    text-align: center;
    color: #f4f1e8;
    font-family: 'Anton', sans-serif;
    line-height: 0.8;
    white-space: nowrap;
  }
  .knockout .l1 { font-size: clamp(3.5rem, 11vw, 8rem); display: block; text-transform: uppercase; }
  .knockout .l2 { font-size: clamp(3.5rem, 11vw, 8rem); display: block; text-transform: lowercase; margin-top: 0.02em; }
  .knockout .l3 { font-size: clamp(3.5rem, 11vw, 8rem); display: block; text-transform: lowercase; margin-top: 0.02em; letter-spacing: -0.01em; }

  .eyebrow {
    font-family: 'Anton', sans-serif;
    letter-spacing: 0.1em;
    font-size: 14px;
    text-transform: uppercase;
    color: #d4291b;
    text-align: center;
  }

  .quote-credit {
    font-family: 'Caveat', cursive;
    font-weight: 600;
    font-size: clamp(1.2rem, 2.2vw, 1.6rem);
    max-width: 460px;
    text-align: center;
    line-height: 1.3;
  }
  .quote-credit .name { display: block; margin-top: 6px; font-size: 0.85em; opacity: 0.65; }

  .signup {
    display: inline-flex;
    border: 2px solid #1a1a1a;
  }
  .signup input {
    background: #f4f1e8; border: none; outline: none;
    padding: 14px 18px; font-family: 'Archivo'; font-weight: 500; font-size: 14px;
    width: 220px; color: #1a1a1a;
  }
  .signup input::placeholder { color: rgba(26,26,26,0.5); }
  .signup button {
    background: #1a1a1a; color: #f4f1e8; border: none;
    padding: 0 22px; font-family: 'Archivo'; font-weight: 900; font-size: 12px;
    letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  }

  .contact-section {
    min-height: 60vh;
    background: #1a1a1a;
    color: #f4f1e8;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
  }
  .label {
    position: fixed; bottom: 20px; left: 20px; z-index: 30;
    font-size: 10px; letter-spacing: 0.1em; background: #1a1a1a; color: #f4f1e8;
    padding: 4px 8px; text-transform: uppercase; font-family: 'Archivo';
  }
</style>
</head>
<body>
<div class="label">Corita — Knockout Block</div>
<header>
  <div class="mark">HOPE&nbsp;AROUSES</div>
  <a class="contact" href="#contact">Contact</a>
</header>
<section class="hero">
  <div class="block">
    <div class="dot"></div>
    <div class="knockout">
      <span class="l1">HOPE</span>
      <span class="l2">arous</span>
      <span class="l3">es</span>
    </div>
  </div>
  <div class="eyebrow">Coming 2027</div>
  <p class="quote-credit">
    "Hope arouses, more than anything else can arouse, a passion for the possible."
    <span class="name">— William Sloane Coffin</span>
  </p>
  <div class="signup">
    <input type="email" placeholder="your email">
    <button>Notify Me</button>
  </div>
</section>
<section class="contact-section" id="contact">— contact block placeholder —</section>
</body>
</html>
